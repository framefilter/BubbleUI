name: package

# Builds bubbleui packages (.apk on 25.x, .ipk on 24.10/23.05) for
# each supported OpenWRT architecture.
#
# Triggered manually (workflow_dispatch) and on tag pushes — we don't
# spin up the OpenWRT SDK on every commit, that's expensive and the
# package only matters at release time. The regular `ci` workflow
# stays fast for everyday pushes.
#
# Outputs are uploaded as artifacts attached to the workflow run; the
# release.yml workflow (later) will promote tagged builds to actual
# GitHub releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWRT release to build SDK against'
        required: false
        default: '25.12.3'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Track 25.12 — current stable line. The AXT1800 has an official
  # firmware build here under qualcommax/ipq60xx; 24.10 only ships it
  # as a snapshot. 25.12 also switched the package format from .ipk
  # to .apk (apk-tools replacing opkg), which the build/locate steps
  # below handle. 23.05 still works in principle but the qualcommax
  # target was reorganized between 23.05 and 25.12 so the SDK paths
  # differ across versions; we don't try to cover the older line.
  OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.3' }}

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipk:
    name: ipk (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # AXT1800, Beryl AX, Marble: aarch64_cortex-a53. qualcommax/
          # ipq60xx is the canonical 25.12 subtarget for IPQ60xx-class
          # SoCs (which is what the AXT1800 runs).
          - target: qualcommax-ipq60xx
            goos: linux
            goarch: arm64
            arch_label: aarch64_cortex-a53
            sdk_url_path: targets/qualcommax/ipq60xx
          # x86_64 generic — Protectli, mini-PCs, OpenWRT-on-VM.
          - target: x86-64
            goos: linux
            goarch: amd64
            arch_label: x86_64
            sdk_url_path: targets/x86/64
          # NOTE: no mipsle/mt7621 build. modernc.org/sqlite (and its
          # modernc.org/libc dependency) has no Go files for GOARCH=
          # mips/mipsle, so the CGO-free build chain we rely on can't
          # target those SoCs. mt7621 routers — common in older travel
          # routers — are out of scope until we either ship a CGO+musl
          # pipeline or replace SQLite with file-backed storage.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Cross-compile daemons
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p ${{ github.workspace }}/bubbleui-bin
          go build -trimpath -ldflags='-s -w' \
            -o ${{ github.workspace }}/bubbleui-bin/ \
            ./cmd/...
          ls -la ${{ github.workspace }}/bubbleui-bin

      - name: Fetch OpenWRT SDK
        id: sdk
        run: |
          set -e
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/${{ matrix.sdk_url_path }}"
          # The SDK tarball name is <openwrt-sdk-VERSION-TARGET-...>.tar.{xz,zst}.
          # OpenWRT moved from xz to zst around 24.10; 23.05 still ships xz.
          # We grep the directory listing rather than guess the exact suffix.
          INDEX=$(curl -fsSL "$BASE/")
          FILE=$(printf '%s' "$INDEX" | grep -oE 'openwrt-sdk-[^"]+\.tar\.(xz|zst)' | head -n1)
          if [ -z "$FILE" ]; then
            echo "::error::could not find SDK tarball at $BASE"
            exit 1
          fi
          echo "Downloading $BASE/$FILE"
          curl -fsSLO "$BASE/$FILE"

          mkdir -p "$HOME/sdk"
          case "$FILE" in
            *.xz)  tar -xJf "$FILE" --strip-components=1 -C "$HOME/sdk" ;;
            *.zst) tar --use-compress-program=unzstd -xf "$FILE" --strip-components=1 -C "$HOME/sdk" ;;
          esac
          echo "sdk_dir=$HOME/sdk" >> "$GITHUB_OUTPUT"

      - name: Prepare SDK feeds
        env:
          SDK: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -e
          cd "$SDK"
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # bubbleui doesn't depend on the golang feed (we ship pre-
          # built static binaries) but install it anyway in case the
          # base image build wants it.

      - name: Symlink bubbleui into SDK package tree
        env:
          SDK: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          ln -sf "${{ github.workspace }}/package/bubbleui" "$SDK/package/bubbleui"

      - name: Build .ipk
        env:
          SDK: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -e
          cd "$SDK"
          # defconfig sets up the .config from feeds.
          make defconfig
          # Make sure bubbleui is selected as a module.
          echo "CONFIG_PACKAGE_bubbleui=m" >> .config
          make defconfig
          # Build it. V=s for verbose so failures are visible.
          make package/bubbleui/compile V=s -j$(nproc) \
            BUBBLEUI_SRC=${{ github.workspace }} \
            BUBBLEUI_BIN=${{ github.workspace }}/bubbleui-bin

      - name: Locate and stage package
        id: locate
        env:
          SDK: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -e
          # 25.x emits .apk via apk-tools; 24.x and 23.x emit .ipk via
          # opkg. Accept either; the BuildPackage macro picks the
          # right one based on the SDK.
          PKG=$(find "$SDK/bin/packages" \( -name 'bubbleui*.apk' -o -name 'bubbleui_*.ipk' \) -print -quit)
          if [ -z "$PKG" ]; then
            echo "::error::No bubbleui package produced. Build artifacts:"
            find "$SDK/bin/packages" -type f | head -30
            exit 1
          fi
          echo "Built: $PKG"
          mkdir -p ${{ github.workspace }}/dist
          cp "$PKG" ${{ github.workspace }}/dist/
          ls -la ${{ github.workspace }}/dist/
          echo "pkg_path=${{ github.workspace }}/dist/$(basename "$PKG")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubbleui-${{ matrix.arch_label }}
          path: ${{ steps.locate.outputs.pkg_path }}
          if-no-files-found: error
          retention-days: 30

  # Builds a flashable OpenWRT firmware image with BubbleUI and ALL its
  # transitive dependencies preinstalled, using the OpenWRT Image
  # Builder for the matching release. The whole point is to break the
  # circular install problem: a privacy-conscious user with a freshly
  # unboxed (or factory-reset) router can flash this single sysupgrade
  # image and have a working BubbleUI on first boot — no SSH, no
  # `apk update`, no WAN-must-be-online-first.
  #
  # We bake in only the AXT1800 image for now; it's the Tier-1
  # reference hardware. Expanding the device matrix is a separate
  # discussion (DESIGN.md §13 / §14).
  image:
    name: image (glinet_gl-axt1800)
    runs-on: ubuntu-latest
    needs: ipk
    steps:
      - uses: actions/checkout@v4

      - name: Download bubbleui package (aarch64_cortex-a53)
        uses: actions/download-artifact@v4
        with:
          name: bubbleui-aarch64_cortex-a53
          path: bubbleui-pkg

      - name: Fetch OpenWRT Image Builder
        id: ib
        run: |
          set -e
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/qualcommax/ipq60xx"
          # Same .xz/.zst auto-detect dance as the SDK step uses.
          INDEX=$(curl -fsSL "$BASE/")
          FILE=$(printf '%s' "$INDEX" | grep -oE 'openwrt-imagebuilder-[^"]+\.Linux-x86_64\.tar\.(xz|zst)' | head -n1)
          if [ -z "$FILE" ]; then
            echo "::error::could not find Image Builder tarball at $BASE"
            exit 1
          fi
          echo "Downloading $BASE/$FILE"
          curl -fsSLO "$BASE/$FILE"

          mkdir -p "$HOME/imagebuilder"
          case "$FILE" in
            *.xz)  tar -xJf "$FILE" --strip-components=1 -C "$HOME/imagebuilder" ;;
            *.zst) tar --use-compress-program=unzstd -xf "$FILE" --strip-components=1 -C "$HOME/imagebuilder" ;;
          esac
          echo "ib_dir=$HOME/imagebuilder" >> "$GITHUB_OUTPUT"

      - name: Stage bubbleui .apk into Image Builder local packages
        env:
          IB: ${{ steps.ib.outputs.ib_dir }}
        run: |
          set -e
          # In 25.x Image Builder, files dropped into packages/ are
          # picked up as a local repo; `make image` indexes them before
          # resolving PACKAGES. Transitive deps of bubbleui (nginx-ssl,
          # nftables, wireguard-tools, dnsmasq-full, https-dns-proxy,
          # yubikey-personalization, ca-bundle, px5g-mbedtls — see
          # package/bubbleui/Makefile) come from the upstream 25.12.3
          # feed, also indexed automatically by Image Builder.
          mkdir -p "$IB/packages"
          cp bubbleui-pkg/bubbleui-*.apk "$IB/packages/"
          ls -la "$IB/packages/"

      - name: Build firmware image
        env:
          IB: ${{ steps.ib.outputs.ib_dir }}
        run: |
          set -e
          cd "$IB"
          # PROFILE pins the exact device (AXT1800). PACKAGES adds
          # bubbleui on top of the profile's defaults; Image Builder
          # resolves and bakes all dependencies into the rootfs, so
          # the resulting sysupgrade.bin is fully self-contained.
          make image \
            PROFILE=glinet_gl-axt1800 \
            PACKAGES="bubbleui" \
            -j$(nproc)
          ls -la bin/targets/qualcommax/ipq60xx/

      - name: Stage images, manifest, and generate FIRMWARE-CONTENTS.md
        env:
          IB: ${{ steps.ib.outputs.ib_dir }}
        run: |
          set -e
          OUT="$IB/bin/targets/qualcommax/ipq60xx"
          DEST="${{ github.workspace }}/dist-image"
          mkdir -p "$DEST"

          # sysupgrade.bin is mandatory; factory image may or may not
          # exist depending on the profile; manifest is mandatory and
          # is our authoritative "what's actually inside" list.
          cp "$OUT"/openwrt-*-glinet_gl-axt1800-squashfs-sysupgrade.bin "$DEST/"
          cp "$OUT"/openwrt-*-glinet_gl-axt1800-squashfs-factory.* "$DEST/" 2>/dev/null || true
          cp "$OUT"/*glinet_gl-axt1800*.manifest "$DEST/"

          MANIFEST=$(ls "$DEST"/*.manifest | head -n1)
          if [ -z "$MANIFEST" ] || [ ! -s "$MANIFEST" ]; then
            echo "::error::manifest missing or empty — cannot generate FIRMWARE-CONTENTS.md"
            exit 1
          fi

          # Manifest is `pkgname version` per line. Render as a sorted
          # markdown table so we can link to it from user-facing docs
          # later and decide what's safe to strip for a smaller image.
          {
            echo "# Firmware contents"
            echo
            echo "Device: **GL.iNet GL-AXT1800** (\`glinet_gl-axt1800\`, qualcommax/ipq60xx, aarch64_cortex-a53)"
            echo "OpenWRT: **${OPENWRT_VERSION}**"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Authoritative list of every package baked into the rootfs of this"
            echo "firmware, generated from the OpenWRT Image Builder manifest. This"
            echo "includes BubbleUI's transitive dependencies — no \`apk update\` and"
            echo "no internet are required on first boot for BubbleUI to function."
            echo
            echo "| Package | Version |"
            echo "|---------|---------|"
            awk 'NF>=2 { printf "| %s | %s |\n", $1, $2 }' "$MANIFEST" | sort
          } > "$DEST/FIRMWARE-CONTENTS.md"

          echo "----- staged firmware artifacts -----"
          ls -la "$DEST/"
          echo "----- FIRMWARE-CONTENTS.md head -----"
          head -30 "$DEST/FIRMWARE-CONTENTS.md"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubbleui-firmware-glinet_gl-axt1800-${{ env.OPENWRT_VERSION }}
          path: dist-image/
          if-no-files-found: error
          retention-days: 30
