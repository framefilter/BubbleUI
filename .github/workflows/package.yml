name: package

# Builds bubbleui_<arch>.ipk for each supported OpenWRT architecture.
#
# Triggered manually (workflow_dispatch) and on tag pushes — we don't
# spin up the OpenWRT SDK on every commit, that's expensive and the
# .ipk only matters at release time. The regular `ci` workflow stays
# fast for everyday pushes.
#
# Outputs are uploaded as artifacts attached to the workflow run; the
# release.yml workflow (later) will promote tagged builds to actual
# GitHub releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWRT release to build SDK against'
        required: false
        default: '24.10.6'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Track 24.10 — current stable line, AXT1800 territory. 23.05 still
  # works in principle but the qualcommax target was reorganized in
  # 24.x so SDK paths differ; we'd need per-version path tables to
  # cover both. 25.x snapshots are deliberately out of scope.
  OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '24.10.6' }}

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipk:
    name: ipk (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # AXT1800, Beryl AX, etc.: aarch64_cortex-a53. In 24.10 the
          # qualcommax target absorbed the old standalone ipq807x;
          # qualcommax/ipq807x is the canonical 24.10 path for this
          # arch. (qualcommax/ipq60xx — where the AXT1800 strictly
          # belongs — first shipped stable images in 25.12; this 24.10
          # build is still install-compatible via the matching arch
          # label.)
          - target: qualcommax-ipq807x
            goos: linux
            goarch: arm64
            arch_label: aarch64_cortex-a53
            sdk_url_path: targets/qualcommax/ipq807x
            openwrt_version: '24.10.6'
          # Native AXT1800 / Beryl AX target. 25.x switched the package
          # manager from opkg to apk, so this entry produces a .apk
          # rather than a .ipk; the Locate step matches both.
          - target: qualcommax-ipq60xx
            goos: linux
            goarch: arm64
            arch_label: aarch64_cortex-a53
            sdk_url_path: targets/qualcommax/ipq60xx
            openwrt_version: '25.12.3'
          # x86_64 generic — Protectli, mini-PCs, OpenWRT-on-VM.
          - target: x86-64
            goos: linux
            goarch: amd64
            arch_label: x86_64
            sdk_url_path: targets/x86/64
            openwrt_version: '24.10.6'
          # NOTE: no mipsle/mt7621 build. modernc.org/sqlite (and its
          # modernc.org/libc dependency) has no Go files for GOARCH=
          # mips/mipsle, so the CGO-free build chain we rely on can't
          # target those SoCs. mt7621 routers — common in older travel
          # routers — are out of scope until we either ship a CGO+musl
          # pipeline or replace SQLite with file-backed storage.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Cross-compile daemons
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p ${{ github.workspace }}/bubbleui-bin
          go build -trimpath -ldflags='-s -w' \
            -o ${{ github.workspace }}/bubbleui-bin/ \
            ./cmd/...
          ls -la ${{ github.workspace }}/bubbleui-bin

      - name: Fetch OpenWRT SDK
        id: sdk
        env:
          # Per-matrix override beats the workflow_dispatch default —
          # 25.12 is required for native ipq60xx, while ipq807x sticks
          # to 24.10 (where its target path still exists).
          MATRIX_OPENWRT_VERSION: ${{ matrix.openwrt_version }}
        run: |
          set -e
          VERSION="${MATRIX_OPENWRT_VERSION:-${OPENWRT_VERSION}}"
          BASE="https://downloads.openwrt.org/releases/${VERSION}/${{ matrix.sdk_url_path }}"
          # The SDK tarball name is <openwrt-sdk-VERSION-TARGET-...>.tar.{xz,zst}.
          # OpenWRT moved from xz to zst around 24.10; 23.05 still ships xz.
          # We grep the directory listing rather than guess the exact suffix.
          INDEX=$(curl -fsSL "$BASE/")
          FILE=$(printf '%s' "$INDEX" | grep -oE 'openwrt-sdk-[^"]+\.tar\.(xz|zst)' | head -n1)
          if [ -z "$FILE" ]; then
            echo "::error::could not find SDK tarball at $BASE"
            exit 1
          fi
          echo "Downloading $BASE/$FILE"
          curl -fsSLO "$BASE/$FILE"

          mkdir -p "$HOME/sdk"
          case "$FILE" in
            *.xz)  tar -xJf "$FILE" --strip-components=1 -C "$HOME/sdk" ;;
            *.zst) tar --use-compress-program=unzstd -xf "$FILE" --strip-components=1 -C "$HOME/sdk" ;;
          esac
          echo "sdk_dir=$HOME/sdk" >> "$GITHUB_OUTPUT"

      - name: Prepare SDK feeds
        env:
          SDK: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -e
          cd "$SDK"
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # bubbleui doesn't depend on the golang feed (we ship pre-
          # built static binaries) but install it anyway in case the
          # base image build wants it.

      - name: Symlink bubbleui into SDK package tree
        env:
          SDK: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          ln -sf "${{ github.workspace }}/package/bubbleui" "$SDK/package/bubbleui"

      - name: Build .ipk
        env:
          SDK: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -e
          cd "$SDK"
          # defconfig sets up the .config from feeds.
          make defconfig
          # Make sure bubbleui is selected as a module.
          echo "CONFIG_PACKAGE_bubbleui=m" >> .config
          make defconfig
          # Build it. V=s for verbose so failures are visible.
          make package/bubbleui/compile V=s -j$(nproc) \
            BUBBLEUI_SRC=${{ github.workspace }} \
            BUBBLEUI_BIN=${{ github.workspace }}/bubbleui-bin

      - name: Locate and stage package
        id: locate
        env:
          SDK: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -e
          # 24.x produces .ipk (opkg), 25.x produces .apk (apk-tools);
          # apk uses '-' as the name/version separator, ipk uses '_'.
          PKG=$(find "$SDK/bin/packages" \
            \( -name 'bubbleui_*.ipk' -o -name 'bubbleui-*.apk' \) \
            -print -quit)
          if [ -z "$PKG" ]; then
            echo "::error::No bubbleui package produced. Build artifacts:"
            find "$SDK/bin/packages" -type f | head -30
            exit 1
          fi
          echo "Built: $PKG"
          mkdir -p ${{ github.workspace }}/dist
          cp "$PKG" ${{ github.workspace }}/dist/
          ls -la ${{ github.workspace }}/dist/
          echo "pkg_path=${{ github.workspace }}/dist/$(basename "$PKG")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Two qualcommax entries share arch_label aarch64_cortex-a53,
          # so include target+version in the name to avoid collision.
          name: bubbleui-${{ matrix.target }}-${{ matrix.openwrt_version }}
          path: ${{ steps.locate.outputs.pkg_path }}
          if-no-files-found: error
          retention-days: 30
