# nginx vhost for BubbleUI.
#
# Terminates TLS with the self-signed cert generated by uci-defaults
# (see DESIGN §6.6 — broad-validity cert so wrong-time-on-boot doesn't
# break the UI). Serves the SPA's static dist and reverse-proxies
# /auth, /api, /vpn, /net, /hw to the matching daemon on 127.0.0.1.
#
# OpenWRT's default nginx ships with `include conf.d/*.conf` from
# /etc/nginx/nginx.conf, so dropping this file is enough — no manual
# nginx.conf edits required.

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	# Plain-HTTP requests are redirected to HTTPS. The browser-time
	# bootstrap (POST /api/time/sync) needs to work before TLS is
	# trusted, but the redirect itself is harmless even with a
	# wrong-time clock.
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;

	ssl_certificate     /etc/bubble/ui.pem;
	ssl_certificate_key /etc/bubble/ui.key;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_ciphers         HIGH:!aNULL:!MD5;
	ssl_session_cache   shared:bubble:1m;

	# Don't leak the nginx version.
	server_tokens off;

	# Static SPA. fall back to /index.html so client-side routing
	# (the hash router) survives full-page reloads on subroutes.
	root /usr/share/bubbleui;
	index index.html;
	location / {
		try_files $uri /index.html;
	}

	# Long-lived assets (Vite emits hashed filenames).
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# bubble-authd: /auth/* and /api/time/sync.
	location /auth/ { proxy_pass http://127.0.0.1:8765; include conf.d/bubbleui.proxy.inc; }
	location /api/  { proxy_pass http://127.0.0.1:8765; include conf.d/bubbleui.proxy.inc; }

	# bubble-vpnd.
	location /vpn/  { proxy_pass http://127.0.0.1:8766; include conf.d/bubbleui.proxy.inc; }

	# bubble-netd.
	location /net/  { proxy_pass http://127.0.0.1:8767; include conf.d/bubbleui.proxy.inc; }

	# bubble-hwd.
	location /hw/   { proxy_pass http://127.0.0.1:8768; include conf.d/bubbleui.proxy.inc; }

	# Reasonable upload cap: WireGuard configs are tiny, recovery
	# codes tinier. 1 MB swallows even pathological cases.
	client_max_body_size 1m;

	# Security headers the daemons themselves don't emit on the
	# static-asset path.
	add_header X-Content-Type-Options "nosniff"          always;
	add_header X-Frame-Options        "DENY"             always;
	add_header Referrer-Policy        "no-referrer"      always;
}
